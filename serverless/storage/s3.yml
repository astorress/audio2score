Resources:
  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:custom.s3.filesBucketName}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Users' audio is never kept: no gallery, no history (plan §9).
      LifecycleConfiguration:
        Rules:
          - Id: delete-everything-after-retention
            Status: Enabled
            ExpirationInDays: ${self:custom.retentionDays}
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # The SPA uploads with presigned POSTs and fetches results with
      # presigned GETs: the signature is the authorization, so any origin
      # may use them.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - GET
              - HEAD
              - POST
            AllowedOrigins:
              - '*'
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
              - Content-Length
            MaxAge: 3600

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt FilesBucket.Arn
              - !Sub ${FilesBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false
