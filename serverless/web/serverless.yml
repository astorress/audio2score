# Web app hosting: private S3 bucket + CloudFront (Origin Access Control),
# SPA fallback to index.html. `npm run deploy-web:<stage>` builds web/ with
# the API URL from SSM and syncs web/dist to the bucket (serverless-s3-sync).
service: web
frameworkVersion: ^4.43.0
configValidationMode: error

provider:
  name: aws
  stage: dev
  region: us-east-1
  stackName: ${self:custom.app}-${self:service}
  deploymentBucket:
    name: ${self:custom.s3.deploymentBucketName.${self:custom.stage}}

resources:
  - ${file(s3.yml)}
  - ${file(cloudfront.yml)}
  - ${file(ssm.yml)}
  - ${file(cfn-collisions.yml)}

plugins:
  - serverless-deployment-bucket
  - '@serverless/safeguards-plugin'
  - serverless-s3-sync

custom:
  org: ${env:ORG}
  app: audio2score
  stage: ${opt:stage, self:provider.stage}
  safeguards:
    - safeguard: framework-version
      enforcementLevel: warning
      config: ${self:frameworkVersion}
    - safeguard: allowed-regions
      enforcementLevel: error
      config:
        - ${self:provider.region}
    - safeguard: no-wild-iam-role-statements
      enforcementLevel: warning
    - safeguard: allowed-stages
      enforcementLevel: error
      config:
        - dev
        - test
        - prod
  servicePrefix: ${self:custom.app}-${self:service}
  developer: ${env:DEVELOPER}
  # AWS managed CloudFront policies.
  cloudfront:
    cachingOptimizedPolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
    securityHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
  s3:
    webBucketName: ${self:custom.app}-web-${aws:accountId}
    deploymentBucketName:
      dev: ${self:provider.region}.${self:custom.org}.${self:custom.app}.${self:custom.stage}.${self:custom.developer}.deploys
      test: ${self:provider.region}.${self:custom.org}.${self:custom.app}.${self:custom.stage}.deploys
      prod: ${self:provider.region}.${self:custom.org}.${self:custom.app}.${self:custom.stage}.deploys
  s3Sync:
    - bucketName: ${self:custom.s3.webBucketName}
      localDir: ../../web/dist
      deleteRemoved: true
      params:
        # Hashed assets are immutable; index.html must always revalidate.
        - index.html:
            CacheControl: 'no-cache'
        - 'assets/**':
            CacheControl: 'public, max-age=31536000, immutable'
